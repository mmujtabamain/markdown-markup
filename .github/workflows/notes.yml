# The release-notes check, for main: a merge request into main raises VERSION past main's and adds
# notes/<VERSION>.md, and every note is well formed (tools/release/check-notes.mjs). While main's
# VERSION has no release yet (the Release workflow held, to run by hand later), a merge request may
# keep it and add to its note: it is held only above the last release. Main's ruleset
# (.github/rulesets/main.json) requires the check by its job's name, "Release notes".
name: Release notes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: VERSION is raised past main's (or past the last release, while main's has none), and every note is well formed
        run: |
          base=""
          if [ -n "${{ github.base_ref }}" ] && git show "origin/${{ github.base_ref }}:VERSION" > /tmp/base-version 2>/dev/null; then
            base="$(tr -d '[:space:]' < /tmp/base-version)"
            # main's version not released yet: the last release's is the one to pass
            if ! git ls-remote --exit-code --tags origin "refs/tags/v$base" > /dev/null 2>&1; then
              base="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' | sort -V | tail -n 1)"
            fi
          fi
          if [ -n "$base" ]; then
            node tools/release/check-notes.mjs --base-version "$base"
          else
            node tools/release/check-notes.mjs
          fi
