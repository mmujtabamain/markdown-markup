# The website end to end (apps/site, Playwright in Chromium): every example and widget page drawn in
# the docs, the landing page, each example as a --target html page, and a React app built from the
# release files. It is the only check that the renderer really draws in a browser, so it runs when
# something it draws from changes, and is skipped for notes, docs and workflow-only changes.
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/**'
      - 'examples/**'
      - 'widgets/**'
      - 'conformance/**'
      - 'scripts/dist.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'apps/site/**'
      - 'packages/**'
      - 'examples/**'
      - 'widgets/**'
      - 'conformance/**'
      - 'scripts/dist.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Website end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # the browser, kept between runs (the system libraries it needs are installed each time)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Chromium
        working-directory: apps/site
        run: pnpm exec playwright install --with-deps chromium
      - name: Every fixture case and document renders in the docs, and the release files and pages work
        run: pnpm e2e
