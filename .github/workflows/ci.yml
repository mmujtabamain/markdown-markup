# Markdown Markup (MKP): types, tests, conformance (Node and Hermes), the React Native renderer's
# tests, and the release CLI on every example. The website end to end is site.yml; the release-notes
# check is notes.yml.
name: MKP

on:
  # once per change: on merge requests, and on main after a merge (a branch push with an open merge
  # request would otherwise run everything twice)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mkp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Types, tests and conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm typecheck
      - name: Tests (parser, checker, evaluator, runtime, round trip, fixtures, Markdown, CLI)
        run: pnpm test
      - name: Conformance suite is up to date
        run: |
          pnpm conformance --generate
          git diff --stat --exit-code -- conformance || (echo "conformance/ is stale: run pnpm conformance --generate" && exit 1)
      - name: Conformance (Node)
        run: pnpm conformance
      - name: The examples cover every gap they claim, and the docs' copies match them
        run: |
          pnpm examples:coverage
          pnpm examples:sync
      - name: No host's name outside the history (GAPS.md, SPEC-NOTES.md)
        run: pnpm check:neutral

  hermes:
    name: Conformance under Hermes
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Hermes CLI (v0.13.0, the facebook/hermes release)
        run: |
          mkdir -p "$RUNNER_TEMP/hermes" && cd "$RUNNER_TEMP/hermes"
          curl -sSL --fail -o hermes.tgz https://github.com/facebook/hermes/releases/download/v0.13.0/hermes-cli-linux.tar.gz
          tar xzf hermes.tgz && ./hermes -version
      - name: Conformance, compiler and maths under Hermes
        run: HERMES="$RUNNER_TEMP/hermes/hermes" pnpm hermes

  react-native:
    name: React Native renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types (strict)
        run: pnpm exec tsc -p packages/react-native/tsconfig.json --noEmit
      - name: Every fixture case and the section-18 document render in the RN renderer
        run: pnpm test:rn

  cli:
    name: The release CLI on every example
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build the release files
        run: node scripts/dist.mjs --out "$RUNNER_TEMP/dist"
      - name: The changelog names every API change since the last release (warnings only)
        run: node scripts/api-diff.mjs --check-current --built "$RUNNER_TEMP/dist"
      - name: Check a pack, and check and build every example with mkp-cli.mjs
        run: |
          mkp() { node "$RUNNER_TEMP/dist/mkp-cli.mjs" "$@"; }
          mkp check --pack examples/29-a-pack/pack
          # every example with the packs beside it (pack, host), as the examples test loads them
          for d in examples/[0-9]*/; do
            P=""; for k in pack host; do [ -d "$d$k" ] && P="$P --pack $d$k"; done
            mkp check "${d}doc.mkp.md" $P
            mkp build "${d}doc.mkp.md" $P --target md,html --md gfm,math --out "$RUNNER_TEMP/out/$(basename "$d")" --no-speech --no-lock
          done
