# The recipes (recipes/): MKP in Vue, Svelte, Solid, Angular, Astro and plain JS, each built on the
# web files scripts/dist.mjs makes from this commit and used in Chromium. Runs when a recipe or what
# the release files are built from changes.
name: Recipes

on:
  push:
    branches: [main]
    paths:
      - 'recipes/**'
      - 'packages/core/**'
      - 'packages/react/**'
      - 'packages/dom/**'
      - 'scripts/dist.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/recipes.yml'
  pull_request:
    paths:
      - 'recipes/**'
      - 'packages/core/**'
      - 'packages/react/**'
      - 'packages/dom/**'
      - 'scripts/dist.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/recipes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recipes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    name: Recipes in a browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # the release files are built from the workspace; the recipes have their own npm lockfile
      - run: pnpm install --frozen-lockfile
      - working-directory: recipes
        run: npm ci --no-audit --no-fund
      - name: The release files into each recipe, and each recipe built
        working-directory: recipes
        run: npm run setup && npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-recipes-${{ runner.os }}-${{ hashFiles('recipes/package-lock.json') }}
      - name: Chromium
        working-directory: recipes
        run: npx playwright install --with-deps chromium
      - name: Each recipe draws, signals, keeps state and unmounts
        working-directory: recipes
        run: npm test
