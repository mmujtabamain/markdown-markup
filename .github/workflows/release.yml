# Publishing MKP's packages to GitHub Packages (npm.pkg.github.com, scope @mmujtabamain), and attaching
# each package's .tgz to the GitHub Release. Publishing a release on GitHub (Releases → Draft a new
# release → a tag like v0.3.0 → Publish) runs it; the tag is the version.
# Which packages go out: PACKAGES below (any of core, react, shadcn, react-native, cli).
# GitHub Packages takes a scope only from the repo's owner: @mmujtabamain while the repo is
# github.com/mmujtabamain/markdown-markup.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g. 0.3.0)
        required: true

permissions:
  contents: write
  packages: write

env:
  PACKAGES: core,react,shadcn,react-native,cli

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: '@mmujtabamain'
      - run: pnpm install --frozen-lockfile
      - name: Types and tests
        run: |
          pnpm typecheck
          pnpm test
      - name: Version
        id: v
        run: |
          v="${{ github.event.release.tag_name || inputs.version }}"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"
      - name: Build the packages
        run: node scripts/release.mjs --version "${{ steps.v.outputs.version }}" --only "$PACKAGES" --pack
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # in dependency order: core, then react (shadcn needs it), then the rest
          for p in core react shadcn react-native cli; do
            case ",$PACKAGES," in *",$p,"*) (cd "release/$p" && npm publish) ;; esac
          done
      - name: Attach the packages to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" release/*.tgz --clobber
