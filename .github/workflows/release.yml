# The release of MKP: every platform's mkp binary, mkp.wasm and the Android libraries, built and
# tested on Linux, then published.
#
# Runs on a version tag (v0.3.0) and by hand. Each build job runs on one Linux runner:
#   - binaries: mkp for Linux on x64 and arm64 (static, musl), macOS on Intel and Apple silicon,
#     and Windows on x64, cross-built with cargo-zigbuild; each goes in its @mkp/cli-<os>-<cpu>;
#   - wasm: mkp.wasm, for @mkp/wasm (wasm32-wasip1, with zig's clang for decNumber's C);
#   - android: the AARs of mkp-android and mkp-android-live, with the runner's NDK.
# Then test runs the Rust workspace, every npm package's tests and every target's conformance
# checks, and publish makes a GitHub release with the binaries, mkp.wasm and the AARs, and
# publishes the npm packages (needs the NPM_TOKEN secret, an npm token that can publish to the
# @mkp scope) and the crates (needs CARGO_REGISTRY_TOKEN). Without a token, its step says so and
# is skipped: the rest of the release still happens.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  ZIGLANG: "0.17.1"
  CARGO_ZIGBUILD: "0.24.1"

jobs:
  binaries:
    name: mkp for ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, platform: linux-x64, exe: mkp }
          - { target: aarch64-unknown-linux-musl, platform: linux-arm64, exe: mkp }
          - { target: x86_64-apple-darwin, platform: darwin-x64, exe: mkp }
          - { target: aarch64-apple-darwin, platform: darwin-arm64, exe: mkp }
          - { target: x86_64-pc-windows-gnu, platform: win32-x64, exe: mkp.exe }
    steps:
      - uses: actions/checkout@v4
      - name: Rust, for ${{ matrix.target }}
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: zig and cargo-zigbuild
        run: pip install "ziglang==$ZIGLANG" "cargo-zigbuild==$CARGO_ZIGBUILD"
      - name: Build
        working-directory: targets/rust
        run: cargo zigbuild --release -p mkp-cli --target ${{ matrix.target }}
      - name: In its platform package
        run: node targets/ts/cli/scripts/copy-binary.mjs --target ${{ matrix.target }}
      - name: Runs where it was built for
        if: matrix.platform == 'linux-x64'
        run: targets/ts/cli/platforms/linux-x64/bin/mkp --version
      - uses: actions/upload-artifact@v4
        with:
          name: mkp-${{ matrix.platform }}
          path: targets/ts/cli/platforms/${{ matrix.platform }}/bin/
          if-no-files-found: error

  wasm:
    name: mkp.wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust, for wasm32-wasip1
        run: rustup toolchain install stable --profile minimal --target wasm32-wasip1 && rustup default stable
      - name: zig
        run: pip install "ziglang==$ZIGLANG"
      - name: Build
        run: MKP_ZIG="python3 -m ziglang" targets/rust/wasm/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mkp-wasm
          path: targets/ts/wasm/mkp.wasm
          if-no-files-found: error

  android:
    name: Android libraries
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Rust, for Android
        run: rustup toolchain install stable --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android && rustup default stable
      - name: The native libraries and their Kotlin bindings, with the runner's NDK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          targets/android/mkp/build.sh
          targets/android/mkp-live/build.sh
      - name: The AARs
        working-directory: targets/android/compose
        run: ./gradlew --no-daemon :mkp-android:assembleRelease :mkp-android-live:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            targets/android/compose/mkp-android/build/outputs/aar/*.aar
            targets/android/compose/mkp-android-live/build/outputs/aar/*.aar
          if-no-files-found: error

  test:
    name: Tests and conformance
    needs: [binaries, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/download-artifact@v4
        with:
          name: mkp-wasm
          path: targets/ts/wasm
      - name: The compiler, the native runtime's check adapter and egui's
        working-directory: targets/rust
        run: |
          cargo build --release -p mkp-cli -p mkp-runtime -p mkp-egui -p mkp-egui-live --bins
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: Rust's tests
        working-directory: targets/rust
        run: cargo test --workspace --no-fail-fast
      - name: The npm packages, built
        run: node tools/release/build-ts.mjs
      - name: A browser for the web targets and the packages' tests
        # every browser test reads MKP_CHROMIUM; the runner has Chrome
        run: echo "MKP_CHROMIUM=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: The npm packages' tests
        run: node tools/release/build-ts.mjs --test-only
      - name: The Android libraries for the JVM
        run: |
          targets/android/mkp/build.sh host
          targets/android/mkp-live/build.sh host
      - name: Every target's conformance checks
        run: mkp target check

  publish:
    name: Publish
    needs: [binaries, wasm, android, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: The version, from the tag (or @mkp/cli's, run by hand)
        id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$v" in [0-9]*) ;; *) v="$(node -p 'require("./targets/ts/cli/package.json").version')" ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Each binary in its platform package, mkp.wasm in @mkp/wasm
        run: |
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            mkdir -p "targets/ts/cli/platforms/$p/bin"
            cp artifacts/mkp-$p/* "targets/ts/cli/platforms/$p/bin/"
            chmod +x targets/ts/cli/platforms/$p/bin/mkp* || true
          done
          cp artifacts/mkp-wasm/mkp.wasm targets/ts/wasm/
      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          mkdir -p release
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            tar -czf "release/mkp-$v-$p.tar.gz" -C "targets/ts/cli/platforms/$p/bin" .
          done
          cp targets/ts/wasm/mkp.wasm "release/mkp-$v.wasm"
          cp artifacts/android/*/build/outputs/aar/*.aar release/ 2>/dev/null || find artifacts/android -name '*.aar' -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS)
          gh release view "v$v" > /dev/null 2>&1 || gh release create "v$v" --title "MKP $v" --generate-notes --verify-tag
          gh release upload "v$v" release/* --clobber
      - name: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::No NPM_TOKEN secret: the npm packages aren't published"
            exit 0
          fi
          node tools/release/build-ts.mjs
          node tools/release/publish-npm.mjs --version "${{ steps.v.outputs.version }}"
      - name: crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::No CARGO_REGISTRY_TOKEN secret: the crates aren't published"
            exit 0
          fi
          tools/release/publish-crates.sh
