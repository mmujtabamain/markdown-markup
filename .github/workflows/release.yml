# Releases and the GitHub Pages site (spec note 138).
#
# Runs on pushes to main only. A push to main is a release: the CI gates, then scripts/dist.mjs, then a GitHub Release v<VERSION>
# with mkp-web-<VERSION>.zip, mkp-cli.mjs and SHA256SUMS, its notes notes/<VERSION>.md followed by
# how to use each asset (scripts/release-body.mjs). If v<VERSION> already exists (a re-run, or a push
# that didn't raise VERSION), nothing is released.
#
# Every push to main then rebuilds the Pages site: the landing page at /, the docs at /docs/, the
# examples at /examples/, and the web files of the last 50 releases unpacked at /v/<version>/, the
# newest also at /latest/, listed in /v/index.json.
# Needs: Settings → Actions → General → Workflow permissions: Read and write.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.v.outputs.version }}
      released: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: The version, and whether it is new
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-notes.mjs
          v="$(tr -d '[:space:]' < VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" > /dev/null 2>&1 || git rev-parse -q --verify "refs/tags/v$v" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$v is already released: nothing to do (raise VERSION and add notes/<version>.md to release)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: A published release says what its note says now
        # a note corrected after its release (or a changelog link added) reaches the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-body.mjs --write-dir /tmp/bodies
          for f in /tmp/bodies/*.md; do
            v="$(basename "$f" .md)"
            gh release view "v$v" > /dev/null 2>&1 || continue
            tail -n +2 "$f" > /tmp/want.md
            gh release view "v$v" --json body -q .body > /tmp/have.md
            if ! diff -q <(sed -e 's/[[:space:]]*$//' /tmp/want.md) <(sed -e 's/[[:space:]]*$//' /tmp/have.md) > /dev/null; then
              gh release edit "v$v" --title "$(head -n 1 "$f")" --notes-file /tmp/want.md
              echo "Updated the text of [v$v](${{ github.server_url }}/${{ github.repository }}/releases/tag/v$v) from its note" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - if: steps.v.outputs.new == 'true'
        run: pnpm install --frozen-lockfile
      - name: Types, tests (the release files' own tests among them), conformance, neutrality
        if: steps.v.outputs.new == 'true'
        run: |
          pnpm typecheck
          pnpm test
          pnpm conformance
          pnpm check:neutral
      - name: Build the release files
        if: steps.v.outputs.new == 'true'
        run: node scripts/dist.mjs --version "${{ steps.v.outputs.version }}" --out dist
      - name: Publish v${{ steps.v.outputs.version }}
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          node scripts/release-body.mjs --version "$v" > /tmp/release.md
          title="$(head -n 1 /tmp/release.md)"
          tail -n +2 /tmp/release.md > /tmp/body.md
          gh release create "v$v" --target "$GITHUB_SHA" --title "$title" --notes-file /tmp/body.md \
            "dist/mkp-web-$v.zip" dist/mkp-cli.mjs dist/SHA256SUMS
          echo "Released [v$v](${{ github.server_url }}/${{ github.repository }}/releases/tag/v$v)" >> "$GITHUB_STEP_SUMMARY"

  pages:
    name: Pages
    needs: release
    # after the release job (which releases nothing when VERSION already has a release)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mkp/site build
        env:
          PLAYGROUND_BASE: /markdown-markup/
      - name: The last 50 releases' web files, at /v/<version>/ and /latest/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site=apps/site/dist
          mkdir -p "$site/v" /tmp/rel
          versions=()
          for tag in $(gh release list --limit 50 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName'); do
            v="${tag#v}"
            gh release download "$tag" --pattern "mkp-web-$v.zip" --dir /tmp/rel --clobber || continue
            mkdir -p "$site/v/$v"
            unzip -q -o -j "/tmp/rel/mkp-web-$v.zip" -d "$site/v/$v"
            versions+=("$v")
          done
          latest="$(printf '%s\n' "${versions[@]}" | sort -V | tail -n 1)"
          if [ -n "$latest" ]; then cp -r "$site/v/$latest" "$site/latest"; fi
          printf '%s\n' "${versions[@]}" | sort -V -r | node -e 'const v=require("fs").readFileSync(0,"utf8").split("\n").filter(Boolean);process.stdout.write(JSON.stringify({latest:v[0]??null,versions:v},null,1)+"\n")' > "$site/v/index.json"
          cat "$site/v/index.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist
      - id: deploy
        uses: actions/deploy-pages@v4
