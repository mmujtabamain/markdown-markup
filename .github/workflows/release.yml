# The release of Extended Mark: every platform's xtmd binary, xtmd.wasm and the Android libraries, built and
# tested on Linux, then published.
#
# Runs on a merge into main whose VERSION has no release yet (the merge request raised VERSION and
# added notes/<VERSION>.md, which the Release notes check holds it to), and by hand. Nothing runs
# when v<VERSION> is already released or tagged. Once everything is built and tested, the merge
# commit is tagged v<VERSION> and released under that tag. Each build job runs on one Linux runner:
#   - binaries: xtmd for Linux on x64 and arm64 (static, musl), macOS on Intel and Apple silicon,
#     and Windows on x64, cross-built with cargo-zigbuild; each goes in its @extended-mark/cli-<os>-<cpu>;
#   - wasm: xtmd.wasm, for @extended-mark/wasm (wasm32-wasip1, with zig's clang for decNumber's C);
#   - android: the AARs of xtmd-android and xtmd-android-live, with the runner's NDK.
# Then test runs the checks every pull request runs (ci.yml), and publish makes the GitHub release
# v<VERSION>, its notes the note's, with the binaries, xtmd.wasm, the AARs and the VS Code extension
# (xtmd-<VERSION>.vsix), and publishes the npm
# packages (xtmd, extended-mark and @extended-mark/*) and the crates (xtmd-*). Each registry is published to by
# trusted publishing once the repository variable says it is set up (NPM_TRUSTED_PUBLISHING,
# CRATES_TRUSTED_PUBLISHING = true), and otherwise with a token: NPM_TOKEN, CARGO_REGISTRY_TOKEN.
# A package's first release needs the token, since a registry sets up trusted publishing only for a
# package it already has. With neither, its step says so and is skipped: the rest of the release
# still happens.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  ZIGLANG: "0.17.1"
  CARGO_ZIGBUILD: "0.24.1"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: The version, and whether it is new
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/release/check-notes.mjs
          v="$(tr -d '[:space:]' < VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # a release, or the tag alone (one made by hand), means this version is out
          if gh release view "v$v" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$v is already released or tagged: nothing to do (raise VERSION and add notes/<version>.md to release)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  binaries:
    name: xtmd for ${{ matrix.platform }}
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, platform: linux-x64, exe: xtmd }
          - { target: aarch64-unknown-linux-musl, platform: linux-arm64, exe: xtmd }
          - { target: x86_64-apple-darwin, platform: darwin-x64, exe: xtmd }
          - { target: aarch64-apple-darwin, platform: darwin-arm64, exe: xtmd }
          - { target: x86_64-pc-windows-gnu, platform: win32-x64, exe: xtmd.exe }
    steps:
      - uses: actions/checkout@v4
      - name: Rust, for ${{ matrix.target }}
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: zig and cargo-zigbuild
        run: pip install "ziglang==$ZIGLANG" "cargo-zigbuild==$CARGO_ZIGBUILD"
      - name: Build
        working-directory: targets/rust
        run: cargo zigbuild --release -p xtmd-cli --target ${{ matrix.target }}
      - name: In its platform package
        run: node targets/ts/cli/scripts/copy-binary.mjs --target ${{ matrix.target }}
      - name: Runs where it was built for
        if: matrix.platform == 'linux-x64'
        run: targets/ts/cli/platforms/linux-x64/bin/xtmd --version
      - uses: actions/upload-artifact@v4
        with:
          name: xtmd-${{ matrix.platform }}
          path: targets/ts/cli/platforms/${{ matrix.platform }}/bin/
          if-no-files-found: error

  wasm:
    name: xtmd.wasm
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust, for wasm32-wasip1
        run: rustup toolchain install stable --profile minimal --target wasm32-wasip1 && rustup default stable
      - name: zig
        run: pip install "ziglang==$ZIGLANG"
      - name: Build
        run: XTMD_ZIG="python3 -m ziglang" targets/rust/wasm/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xtmd-wasm
          path: targets/ts/wasm/xtmd.wasm
          if-no-files-found: error

  android:
    name: Android libraries
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Rust, for Android
        run: rustup toolchain install stable --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android && rustup default stable
      - name: The native libraries and their Kotlin bindings, with the runner's NDK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          targets/android/xtmd/build.sh
          targets/android/xtmd-live/build.sh
      - name: The AARs
        working-directory: targets/android/compose
        run: ./gradlew --no-daemon :xtmd-android:assembleRelease :xtmd-android-live:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            targets/android/compose/xtmd-android/build/outputs/aar/*.aar
            targets/android/compose/xtmd-android-live/build/outputs/aar/*.aar
          if-no-files-found: error

  test:
    name: The checks every pull request runs
    needs: version
    if: needs.version.outputs.new == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: [version, binaries, wasm, android, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      # trusted publishing: npm and crates.io take the run's OIDC token in place of a secret
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Each binary in its platform package, xtmd.wasm in @extended-mark/wasm
        run: |
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            mkdir -p "targets/ts/cli/platforms/$p/bin"
            cp artifacts/xtmd-$p/* "targets/ts/cli/platforms/$p/bin/"
            chmod +x targets/ts/cli/platforms/$p/bin/xtmd* || true
          done
          cp artifacts/xtmd-wasm/xtmd.wasm targets/ts/wasm/
      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.version.outputs.version }}"
          mkdir -p release
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            tar -czf "release/xtmd-$v-$p.tar.gz" -C "targets/ts/cli/platforms/$p/bin" .
          done
          cp targets/ts/wasm/xtmd.wasm "release/xtmd-$v.wasm"
          # the VS Code extension, to install from the release (Extensions: Install from VSIX…)
          node tools/release/build-ts.mjs
          (cd ide/vscode && npm install --no-audit --no-fund && npm run package -- -o "../../release/xtmd-$v.vsix")
          cp artifacts/android/*/build/outputs/aar/*.aar release/ 2>/dev/null || find artifacts/android -name '*.aar' -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS)
          node tools/release/check-notes.mjs --notes-for "$v" > /tmp/notes.md
          title="$(head -n 1 /tmp/notes.md)"
          tail -n +2 /tmp/notes.md > /tmp/body.md
          # the tag v<VERSION> is made here, on the commit this run is for: the merge's
          gh release view "v$v" > /dev/null 2>&1 || gh release create "v$v" --target "$GITHUB_SHA" --title "$title" --notes-file /tmp/body.md
          gh release upload "v$v" release/* --clobber
      - name: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ "$TRUSTED" != "true" ] && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::No trusted publishing (NPM_TRUSTED_PUBLISHING) and no NPM_TOKEN secret: the npm packages aren't published"
            exit 0
          fi
          # trusted publishing needs npm 11.5.1 or later
          npm install -g npm@11
          node tools/release/build-ts.mjs
          node tools/release/publish-npm.mjs --version "${{ needs.version.outputs.version }}"
      - name: A crates.io token from trusted publishing
        id: crates-auth
        if: vars.CRATES_TRUSTED_PUBLISHING == 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::No trusted publishing (CRATES_TRUSTED_PUBLISHING) and no CARGO_REGISTRY_TOKEN secret: the crates aren't published"
            exit 0
          fi
          tools/release/publish-crates.sh
