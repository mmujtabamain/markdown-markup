[package]
name = "mkp-cli"
description = "The mkp command: check, fmt, build and md"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mkp"
path = "src/main.rs"

[dependencies]
mkp-syntax = { path = "../compiler/syntax" }
mkp-check = { path = "../compiler/check" }
mkp-ir = { path = "../compiler/ir" }
mkp-lower = { path = "../compiler/lower" }
mkp-markdown = { path = "../compiler/markdown" }
serde_json.workspace = true
serde.workspace = true
toml = "0.8"

[dev-dependencies]
mkp-eval = { path = "../eval" }
jsonschema = { version = "0.61", default-features = false }
