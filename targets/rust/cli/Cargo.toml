[package]
name = "mkp-cli"
description = "The mkp command: check, fmt, build and md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mkp"
path = "src/main.rs"

[dependencies]
mkp-syntax = { path = "../compiler/syntax", version = "0.3.0" }
mkp-check = { path = "../compiler/check", version = "0.3.0" }
mkp-ir = { path = "../compiler/ir", version = "0.3.0" }
mkp-lower = { path = "../compiler/lower", version = "0.3.0" }
mkp-markdown = { path = "../compiler/markdown", version = "0.3.0" }
serde_json.workspace = true
serde.workspace = true
toml = "0.8"

[dev-dependencies]
mkp-eval = { path = "../eval" }
jsonschema = { version = "0.61", default-features = false }
