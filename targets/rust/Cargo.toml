[workspace]
resolver = "2"
members = [
    "compiler/syntax",
    "compiler/ir",
    "compiler/check",
    "compiler/lower",
    "compiler/markdown",
    "eval",
    "runtime",
    "egui",
    "egui-live",
    "schemagen",
    "cli",
    "live",
    "wasm",
    "../android/mkp",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"


[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
