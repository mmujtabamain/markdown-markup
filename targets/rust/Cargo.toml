[workspace]
resolver = "2"
members = [
    "compiler/syntax",
    "compiler/ir",
    "schemagen",
    "cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"


[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
