# targets/rust/egui-live/target.yaml: xtmd-egui-live, the real-time desktop target: each case's own
# text compiled in the app by xtmd-live's compiler, then drawn by xtmd-egui's widgets, headless
# through egui_kittest and read through AccessKit. It runs the prebuilt release binary; build it first:
#   cd targets/rust && cargo build --release -p xtmd-egui-live
name: egui-live
levels: [core.draw, core.live, core.gfx]
supplies:
  widgets: [core/*]                     # core's externs only; a pack brings its own
  fns: [core/moment.local]
cannot:
  core/math: "egui has no maths renderer; the formula shows as its TeX"
tokens: core                            # xtmd-egui draws core's own tokens
check_adapter: exec ../target/release/xtmd_egui_live_check_adapter
