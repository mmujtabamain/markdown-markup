# targets/ts/bindings/svelte-live/target.yaml: the svelte-live target, real time: <MkpLiveDoc> drawn by svelte itself from
# @mkp/view's elements (core's widgets as the web target draws them), compiling the document's text in the browser with @mkp/wasm
name: svelte-live
levels: [core.draw, core.live, core.gfx]
supplies:
  widgets: [core/*]                     # core's externs only; a pack brings its own
  fns: [core/can_draw_tex, core/moment.local]
tokens: core                            # @mkp/dom's stylesheet draws core's own tokens
check_adapter: exec node ../testing/view_adapter.mjs svelte-live check/harness.mjs svelte live
