# targets/ts/bindings/vue-live/target.yaml: the vue-live target, real time: <XtmdLiveDoc> drawn by vue itself from
# @extended-mark/view's elements (core's widgets as the web target draws them), compiling the document's text in the browser with @extended-mark/wasm
name: vue-live
levels: [core.draw, core.live, core.gfx]
supplies:
  widgets: [core/*]                     # core's externs only; a pack brings its own
  fns: [core/can_draw_tex, core/moment.local]
tokens: core                            # @extended-mark/dom's stylesheet draws core's own tokens
check_adapter: exec node ../testing/view_adapter.mjs vue-live check/harness.mjs live
