<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MKP framework targets</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --ink: #1a1c1f; --muted: #6b7280; --line: #d4d7dc; --surface: #fff; --panel: #f6f7f9; --accent: #4257d6; --bad: #c62828; --ok: #15803d; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.45 system-ui, sans-serif; color: var(--ink); background: var(--panel); }
      header { padding: 14px 20px 4px; }
      h1 { font-size: 20px; margin: 0 0 2px; }
      header p { margin: 0; color: var(--muted); }
      .fw { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 12px; padding: 8px 20px; align-items: start; }
      .fw > h2 { font-size: 16px; margin: 10px 0 0; }
      .pane { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      .kind { font-size: 12px; font-weight: 600; color: var(--accent); }
      .kind code { font-weight: 400; color: var(--muted); }
      textarea { width: 100%; height: 56px; font: 12px/1.4 ui-monospace, monospace; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); resize: none; }
      .page { min-height: 60px; }
      .state, .status { font: 12px ui-monospace, monospace; color: var(--muted); }
      .status[data-state="ok"] { color: var(--ok); }
      .status[data-state="errors"] { color: var(--bad); }
    </style>
  </head>
  <body>
    <header>
      <h1>Five frameworks, two kinds of target each</h1>
      <p>Left: run time, <code>MkpDoc</code> from an IR built ahead, no compiler. Right: real time, <code>MkpLiveDoc</code> from the text, compiled in the browser by mkp.wasm. Every page is drawn by the framework itself.</p>
    </header>
    <main id="rows"></main>
    <script src="/shell.js"></script>
  </body>
</html>
