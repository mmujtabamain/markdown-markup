# targets/ts/bindings/angular/target.yaml: the angular target, run time: <MkpDoc> drawn by angular itself from
# @mkp/view's elements (core's widgets as the web target draws them), from an IR it is given
name: angular
levels: [core.draw, core.live, core.gfx]
supplies:
  widgets: [core/*]                     # core's externs only; a pack brings its own
  fns: [core/can_draw_tex, core/moment.local]
tokens: core                            # @mkp/dom's stylesheet draws core's own tokens
check_adapter: exec node ../testing/view_adapter.mjs angular check/harness.ts decorators
