# yaml-language-server: $schema=https://raw.githubusercontent.com/mmujtabamain/omnicui/v0.2.4/tools/omnicui/schema/contract.schema.json
# core/divider (core/blocks.xtpack): a line across the page. @extended-mark/dom draws an <hr>.
id: core.divider

parts:
  # role separator, which omnicui's role table doesn't have: declared generic
  divider: { role: generic }

tests:
  - name: a line across the page, with no words
    expect:
      - { part: divider, visible: true, text: "" }

viewports: [{ width: 480, height: 240 }]
