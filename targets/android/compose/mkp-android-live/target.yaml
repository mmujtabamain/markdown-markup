# targets/android/compose/mkp-android-live/target.yaml: mkp-android-live, the real-time Android target:
# each case's own text compiled on the device (libmkp_android_live.so), then drawn by mkp-android's
# MkpDoc with our Compose widgets, under Robolectric on a plain JVM. Build it first:
#   ../../mkp/build.sh host && ../../mkp-live/build.sh host && ../gradlew -p .. :mkp-android:checkAdapterArgs
name: android-live
levels: [core.draw, core.live, core.gfx]
supplies:
  widgets: [core/*]                     # core's externs only; a pack brings its own
  fns: [core/can_draw_tex, core/moment.local]
tokens: ../tokens.mkp                   # Material 3 colours, type and spacing
check_adapter: exec java @../build/check_adapter.args mkp.android.LiveCheckAdapter   # Compose under Robolectric, on the JVM
