# targets/android/compose/target.yaml: mkp-android, the native runtime drawn with our default Jetpack
# Compose and Material 3 widgets. The check adapter runs Compose under Robolectric on a plain JVM,
# so the checks need no emulator. Build it first (README.md):
#   ../mkp/build.sh host && ./gradlew :mkp-android:checkAdapterArgs
name: android
levels: [core.draw, core.live, core.gfx]
supplies:
  widgets: [core/*]                     # core's externs only; a pack brings its own
  fns: [core/can_draw_tex, core/moment.local]
tokens: tokens.mkp                      # Material 3 colours, type and spacing
check_adapter: exec java @build/check_adapter.args mkp.android.CheckAdapter   # Compose under Robolectric, on the JVM
