[package]
name = "xtmd-android-live"
description = "Extended Mark's real-time Android target, native side: xtmd-live's compiler (core compiled once) behind a UniFFI interface. A document's text goes in, the IR xtmd build writes comes out as JSON, and xtmd-android's XtmdDoc runs it on xtmd-android's own library. The run-time target carries no compiler; this library does."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# shipped another way (a tool here; xtmd.wasm; the Android libraries), not as a crate
publish = false
# a member of the Rust workspace in targets/rust, which isn't above this folder
workspace = "../../rust"

[lib]
name = "xtmd_android_live"
# cdylib: libxtmd_android_live.so, for Android's processors and for the host's JVM (Robolectric, through JNA)
crate-type = ["cdylib", "lib"]

[dependencies]
xtmd-live = { path = "../../rust/live", version = "0.3.0" }
serde_json.workspace = true
uniffi = "=0.29.5"
