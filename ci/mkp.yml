# Markdown Markup (MKP): types, tests, conformance (Node and Hermes), the React Native renderer's
# tests, the web playground end to end, and the single-executable CLI. The source of this file is
# mkp/ci/mkp.yml; it is copied to .github/workflows/mkp.yml.
name: MKP

on:
  push:
    paths: ["mkp/**", ".github/workflows/mkp.yml"]
  pull_request:
    paths: ["mkp/**", ".github/workflows/mkp.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mkp-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mkp

jobs:
  core:
    name: Types, tests and conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mkp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm typecheck
      - name: Tests (parser, checker, evaluator, runtime, round trip, fixtures, Markdown, CLI)
        run: pnpm test
      - name: Conformance suite is up to date
        run: |
          pnpm conformance --generate
          git diff --stat --exit-code -- conformance || (echo "conformance/ is stale: run pnpm conformance --generate" && exit 1)
      - name: Conformance (Node)
        run: pnpm conformance

  hermes:
    name: Conformance under Hermes
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mkp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Hermes CLI (v0.13.0, the facebook/hermes release)
        run: |
          mkdir -p "$RUNNER_TEMP/hermes" && cd "$RUNNER_TEMP/hermes"
          curl -sSL --fail -o hermes.tgz https://github.com/facebook/hermes/releases/download/v0.13.0/hermes-cli-linux.tar.gz
          tar xzf hermes.tgz && ./hermes -version
      - name: Conformance, compiler and maths under Hermes
        run: HERMES="$RUNNER_TEMP/hermes/hermes" pnpm hermes

  react-native:
    name: React Native renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mkp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types (strict)
        run: pnpm exec tsc -p packages/react-native/tsconfig.json --noEmit
      - name: Every fixture case and the section-18 document render in the RN renderer
        run: pnpm test:rn

  web:
    name: Web playground end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mkp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Chromium
        working-directory: mkp/apps/playground
        run: pnpm exec playwright install --with-deps chromium
      - name: Every fixture case and document renders in the playground
        run: pnpm e2e

  cli:
    name: Single-executable CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mkp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build the executable
        run: pnpm --filter @mkp/cli sea
      - name: Build the section-18 document with it
        run: |
          P="--pack packs/mkp-ui --pack packs/mkp-math --pack packs/mkp-learn --pack packs/mkp-diagrams --pack examples/spec18"
          ./packages/cli/dist/mkp check $P --pack packs/mkp-charts --pack packs/mkp-data --pack packs/mkp-cs
          ./packages/cli/dist/mkp build examples/spec18/roots.mkp.md $P --target md --md gfm,math,mermaid,html --no-lock
